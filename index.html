<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioTech & Med Daily</title>
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#0F2E15',
                        mint: '#DAE2CB',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-forest text-mint flex flex-col min-h-screen">
    
    <!-- Header -->
    <header class="bg-forest border-b border-mint/20 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-6 flex flex-col md:flex-row md:justify-between md:items-center">
            <div class="mb-4 md:mb-0">
                <h1 class="text-4xl md:text-5xl font-black tracking-tighter mb-1 text-mint uppercase drop-shadow-md italic">BioTech & Med</h1>
                <p class="text-mint/80 text-md md:text-lg font-medium">Dein tägliches Update aus Medizin, Molekularbiologie und Biotechnologie</p>
            </div>
            <div>
                <button id="toggle-bookmarks" class="bg-mint text-forest hover:bg-white px-6 py-3 rounded-full font-bold transition-all duration-300 shadow-md flex items-center hover:shadow-lg transform hover:-translate-y-1">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                    <span id="toggle-bookmarks-text">Gespeichert</span> (<span id="bookmark-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="container mx-auto px-4 py-12 flex-grow">
        
        <!-- Category Pills (Design-like) -->
        <div class="flex flex-wrap gap-3 mb-12">
            <button class="px-6 py-2 rounded-full border-2 border-mint/40 text-mint hover:bg-mint hover:text-forest transition-colors font-bold text-sm tracking-wide">Medizin</button>
            <button class="px-6 py-2 rounded-full border-2 border-mint/40 text-mint hover:bg-mint hover:text-forest transition-colors font-bold text-sm tracking-wide">Molekularbiologie</button>
            <button class="px-6 py-2 rounded-full border-2 border-mint/40 text-mint hover:bg-mint hover:text-forest transition-colors font-bold text-sm tracking-wide">Biotechnologie</button>
            <button class="px-6 py-2 rounded-full bg-mint text-forest font-bold text-sm tracking-wide">Alle</button>
        </div>

        <!-- Top News -->
        <section class="mb-16">
            <div class="flex items-center mb-8">
                <h2 class="text-4xl md:text-5xl font-black text-mint tracking-tight">Top-News des Tages</h2>
            </div>
            
            <div id="top-news" class="bg-mint rounded-[2.5rem] shadow-2xl overflow-hidden transition-all duration-300">
                <div class="p-16 text-center text-forest/70 animate-pulse">
                    <div class="text-2xl font-bold">Lade aktuelle Nachrichten...</div>
                </div>
            </div>
        </section>

        <!-- News Grid -->
        <section>
            <div class="flex items-center mb-8 mt-16">
                <h2 class="text-4xl md:text-5xl font-black text-mint tracking-tight">Aktuelle Meldungen</h2>
            </div>
            
            <div id="news-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Placeholder -->
            </div>
        </section>
        
    </main>

    <!-- Footer -->
    <footer class="bg-forest border-t border-mint/20 text-mint/60 py-10 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p class="font-medium">&copy; <span id="year"></span> BioTech & Med Daily. Ein automatisiertes Projekt.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
