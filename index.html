<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioTech & Med Daily</title>
    <!-- Tailwind CSS (via CDN für einfache Nutzung) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    
    <!-- Kopfzeile (Header) -->
    <header class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-6 flex flex-col md:flex-row md:justify-between md:items-center">
            <div class="mb-4 md:mb-0">
                <h1 class="text-4xl font-extrabold tracking-tight mb-1 drop-shadow-md">BioTech & Med Daily</h1>
                <p class="text-blue-200 text-md md:text-lg">Dein tägliches Update aus Medizin, Molekularbiologie und Biotechnologie</p>
            </div>
            <div>
                <button id="toggle-bookmarks" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-full font-semibold transition-all duration-300 shadow-md flex items-center hover:shadow-lg transform hover:-translate-y-1">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                    <span id="toggle-bookmarks-text">Gespeichert</span> (<span id="bookmark-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- Hauptinhalt -->
    <main class="container mx-auto px-4 py-10 flex-grow">
        
        <!-- Bereich: Top-News des Tages -->
        <section class="mb-14">
            <div class="flex items-center mb-6">
                <div class="h-8 w-2 bg-blue-600 rounded-full mr-3"></div>
                <h2 class="text-3xl font-bold text-gray-900">Top-News des Tages</h2>
            </div>
            
            <!-- Hier wird die wichtigste Nachricht per JS eingefügt -->
            <div id="top-news" class="bg-white rounded-2xl shadow-xl overflow-hidden transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
                <div class="p-12 text-center text-gray-500 animate-pulse">
                    <div class="text-xl">Lade aktuelle Nachrichten...</div>
                </div>
            </div>
        </section>

        <!-- Bereich: Weitere Nachrichtenliste -->
        <section>
            <div class="flex items-center mb-6">
                <div class="h-8 w-2 bg-indigo-600 rounded-full mr-3"></div>
                <h2 class="text-3xl font-bold text-gray-900">Aktuelle Meldungen</h2>
            </div>
            
            <!-- Grid für die Nachrichten-Karten (wird per JS befüllt) -->
            <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Platzhalter während des Ladens -->
            </div>
        </section>
        
    </main>

    <!-- Fußzeile (Footer) -->
    <footer class="bg-gray-900 text-gray-400 py-8 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; <span id="year"></span> BioTech & Med Daily. Ein automatisiertes Projekt.</p>
        </div>
    </footer>

    <!-- Einbindung des Frontend-Skripts -->
    <script src="script.js"></script>
</body>
</html>
